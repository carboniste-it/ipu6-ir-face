# /etc/ir-face.conf — site settings for the IPU6 IR face-login tools (sourced by shell, parsed by python).
# v4l-utils location (media-ctl, v4l2-ctl). Debian/Ubuntu: apt install v4l-utils
IR_TOOLS=/usr/bin
# ACPI id of the IR sensor and of the illuminator (LM3643 flash driver)
IR_SENSOR_ACPI=OVTI9234
IR_LED_ACPI=INT347D
IR_LED_I2C_ADDR=0x63
# LM3643 torch code used while authenticating (0x3F ~ 89 mA; vendor Windows driver pulses ~360 mA in flash mode)
IR_LED_TORCH_CODE=0x3F
# Media entities (as printed by `media-ctl -p`)
IR_CSI_ENTITY="Intel IPU6 CSI2 0"
IR_CAPTURE_ENTITY="Intel IPU6 ISYS Capture 0"
IR_FORMAT=Y10_1X10/644x364
# Optional v4l2loopback node for apps (not needed for login)
IR_LOOPBACK=/dev/video43
# RGB webcam loopback node to probe after an IR session (leave empty to skip the HAL-recovery check)
RGB_LOOPBACK=/dev/video42
