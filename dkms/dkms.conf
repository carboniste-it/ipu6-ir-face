PACKAGE_NAME="ipu6-ir-ov9234"
PACKAGE_VERSION="1.0.0"
AUTOINSTALL="yes"
# Sources are the Ubuntu/upstream 7.0 IPU6 tree plus two small changes; older kernels keep their manual override.
BUILD_EXCLUSIVE_KERNEL="^(7|8)\."
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="ov9234"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="ipu-bridge"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="intel-ipu6-isys"
BUILT_MODULE_LOCATION[2]="ipu6/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
# intel-ipu6 (core) is built for symbol consistency but intentionally NOT installed: the stock core is used.
